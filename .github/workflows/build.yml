name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Build unsigned development package
        run: ./scripts/package.sh
      - name: Verify package contents
        run: python3 scripts/verify-package.py dist/*.qplug
